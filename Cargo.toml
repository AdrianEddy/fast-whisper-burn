[package]
name = "fast-whisper-burn"
version = "0.1.0"
edition = "2024"

[dependencies]
burn         = { git = "https://github.com/tracel-ai/burn", rev = "826be49ab1ad74a6bdea5837653a2700966cfff8", default-features = false, features = ["autotune", "fusion", "flex", "extension"] }
burn-store   = { git = "https://github.com/tracel-ai/burn", rev = "826be49ab1ad74a6bdea5837653a2700966cfff8", features = ["std", "pytorch"] }
burn-cubecl  = { git = "https://github.com/tracel-ai/burn", rev = "826be49ab1ad74a6bdea5837653a2700966cfff8" }
burn-fusion  = { git = "https://github.com/tracel-ai/burn", rev = "826be49ab1ad74a6bdea5837653a2700966cfff8" }
burn-ir      = { git = "https://github.com/tracel-ai/burn", rev = "826be49ab1ad74a6bdea5837653a2700966cfff8" }
burn-backend = { git = "https://github.com/tracel-ai/burn", rev = "826be49ab1ad74a6bdea5837653a2700966cfff8" }
cubecl       = { git = "https://github.com/tracel-ai/cubecl", rev = "a29d3cd9710a0b16944e46e0ccf374b60fc52de7", features = ["stdlib"] }
half = "2"
serde = { version = "1.0", features = ["std", "derive"] }
hound = "3.5.1"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
strum = "0.28.0"
strum_macros = "0.28.0"
log = "0.4"
mt19937 = "3.3.0"
simplelog = "0.12"

[features]
default = ["wgpu"]
wgpu   = ["burn/wgpu"]
metal  = ["burn/metal"]
vulkan = ["burn/vulkan"]
webgpu = ["burn/webgpu"]
cuda   = ["burn/cuda"]