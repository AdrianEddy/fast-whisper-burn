[package]
name = "fast-whisper-burn"
version = "0.1.0"
edition = "2024"

[dependencies]
burn         = { git = "https://github.com/tracel-ai/burn", rev = "aa57952dde04a5b8dcaa48fd30e9a77c63ffa9a9", default-features = false, features = ["autotune", "fusion", "flex", "extension"] }
burn-store   = { git = "https://github.com/tracel-ai/burn", rev = "aa57952dde04a5b8dcaa48fd30e9a77c63ffa9a9", features = ["std", "pytorch"] }
burn-cubecl  = { git = "https://github.com/tracel-ai/burn", rev = "aa57952dde04a5b8dcaa48fd30e9a77c63ffa9a9" }
burn-fusion  = { git = "https://github.com/tracel-ai/burn", rev = "aa57952dde04a5b8dcaa48fd30e9a77c63ffa9a9" }
burn-ir      = { git = "https://github.com/tracel-ai/burn", rev = "aa57952dde04a5b8dcaa48fd30e9a77c63ffa9a9" }
burn-backend = { git = "https://github.com/tracel-ai/burn", rev = "aa57952dde04a5b8dcaa48fd30e9a77c63ffa9a9" }
cubecl       = { git = "https://github.com/tracel-ai/cubecl", rev = "6c9af8de97ad0ec782e78fe05f7db45b3ee987d6", features = ["stdlib"] }
half = "2"
serde = { version = "1.0", features = ["std", "derive"] }
hound = "3.5.1"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
strum = "0.28.0"
strum_macros = "0.28.0"
log = "0.4"
mt19937 = "3.3.0"
simplelog = "0.12"

[features]
default = ["wgpu"]
wgpu   = ["burn/wgpu"]
metal  = ["burn/metal"]
vulkan = ["burn/vulkan"]
webgpu = ["burn/webgpu"]
cuda   = ["burn/cuda"]