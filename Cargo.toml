[package]
name = "fast-whisper-burn"
version = "0.1.0"
edition = "2024"

[dependencies]
#burn         = { version = "0.21", features = ["vulkan", "autotune", "fusion", "flex"] }
#burn-store   = { version = "0.21", features = ["burnpack", "pytorch"] }
#burn-cubecl  = { version = "0.21" }
#burn-fusion  = { version = "0.21" }
#burn-ir      = { version = "0.21" }
#burn-backend = { version = "0.21" }
#cubecl       = { version = "0.10.0", features = ["stdlib"] }
burn         = { git = "https://github.com/tracel-ai/burn", rev = "0034f64bf0827b1156057c7b09ba4f093a77bfa4", features = ["autotune", "fusion", "flex", "extension"] }
burn-store   = { git = "https://github.com/tracel-ai/burn", rev = "0034f64bf0827b1156057c7b09ba4f093a77bfa4", features = ["burnpack", "pytorch"] }
burn-cubecl  = { git = "https://github.com/tracel-ai/burn", rev = "0034f64bf0827b1156057c7b09ba4f093a77bfa4" }
burn-fusion  = { git = "https://github.com/tracel-ai/burn", rev = "0034f64bf0827b1156057c7b09ba4f093a77bfa4" }
burn-ir      = { git = "https://github.com/tracel-ai/burn", rev = "0034f64bf0827b1156057c7b09ba4f093a77bfa4" }
burn-backend = { git = "https://github.com/tracel-ai/burn", rev = "0034f64bf0827b1156057c7b09ba4f093a77bfa4" }
cubecl       = { git = "https://github.com/tracel-ai/cubecl", rev = "9a783fdef4997d18c6333600c049f898b0b4fc7c", features = ["stdlib"] }
half = "2"
serde = { version = "1.0", features = ["std", "derive"] }
hound = "3.5.1"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
strum = "0.28.0"
strum_macros = "0.28.0"
log = "0.4"
mt19937 = "3.3.0"
simplelog = "0.12"

[features]
default = ["wgpu"]
wgpu   = ["burn/wgpu"]
metal  = ["burn/metal"]
vulkan = ["burn/vulkan"]
webgpu = ["burn/webgpu"]
cuda   = ["burn/cuda"]