[package]
name = "fast-whisper-burn"
version = "0.1.0"
edition = "2024"

[dependencies]
burn         = { git = "https://github.com/AdrianEddy/burn.git", features = ["wgpu", "autotune", "fusion", "ndarray"] }
burn-store   = { git = "https://github.com/AdrianEddy/burn.git", features = ["burnpack", "pytorch"] }
burn-cubecl  = { git = "https://github.com/AdrianEddy/burn.git" }
burn-fusion  = { git = "https://github.com/AdrianEddy/burn.git" }
burn-ir      = { git = "https://github.com/AdrianEddy/burn.git" }
burn-backend = { git = "https://github.com/AdrianEddy/burn.git" }
cubecl       = { git = "https://github.com/tracel-ai/cubecl", rev = "bcc09c30da0f70c9a5b79b5547da7325bafdf8af",  features = ["stdlib"] }
half = "2"
serde = { version = "1.0", features = ["std", "derive"] }
hound = "3.5.1"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
strum = "0.28.0"
strum_macros = "0.28.0"
log = "0.4"
mt19937 = "3.3.0"