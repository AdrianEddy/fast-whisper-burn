[package]
name = "fast-whisper-burn"
version = "0.1.0"
edition = "2024"

[dependencies]
#burn         = { version = "0.22", features = ["autotune", "fusion", "flex", "extension"] }
#burn-store   = { version = "0.22", features = ["std", "pytorch"] }
#burn-cubecl  = { version = "0.22" }
#burn-fusion  = { version = "0.22" }
#burn-ir      = { version = "0.22" }
#burn-backend = { version = "0.22" }
#cubecl       = { version = "0.11", features = ["stdlib"] }
burn         = { git = "https://github.com/tracel-ai/burn", rev = "b31fa6d", default-features = false, features = ["autotune", "fusion", "flex", "extension"] }
burn-store   = { git = "https://github.com/tracel-ai/burn", rev = "b31fa6d", features = ["std", "pytorch"] }
burn-cubecl  = { git = "https://github.com/tracel-ai/burn", rev = "b31fa6d" }
burn-fusion  = { git = "https://github.com/tracel-ai/burn", rev = "b31fa6d" }
burn-ir      = { git = "https://github.com/tracel-ai/burn", rev = "b31fa6d" }
burn-backend = { git = "https://github.com/tracel-ai/burn", rev = "b31fa6d" }
cubecl       = { git = "https://github.com/tracel-ai/cubecl", rev = "0f41bacca8f47c4b9f538cfd364f9ee567eee3d2", features = ["stdlib"] }
half = "2"
serde = { version = "1.0", features = ["std", "derive"] }
hound = "3.5.1"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
strum = "0.28.0"
strum_macros = "0.28.0"
log = "0.4"
mt19937 = "3.3.0"
simplelog = "0.12"

[features]
default = ["wgpu"]
wgpu   = ["burn/wgpu"]
metal  = ["burn/metal"]
vulkan = ["burn/vulkan"]
webgpu = ["burn/webgpu"]
cuda   = ["burn/cuda"]